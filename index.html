<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thar Racing Mania</title>
    <style>
        body { text-align: center; background-color: #000; color: white; font-family: Arial; margin: 0; }
        canvas { background: #333; border: 5px solid #fff; margin-top: 20px; box-shadow: 0 0 20px #555; }
        .controls { margin-top: 20px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 10px; background: #c0392b; color: white; border: none; }
    </style>
</head>
<body>
    <h1>Thar Racing Mania 🚙</h1>
    <p>स्कोर: <span id="score">0</span></p>
    <canvas id="gameCanvas" width="300" height="400"></canvas>
    <div class="controls">
        <button onclick="move(-40)">⬅️ बाएँ</button>
        <button onclick="move(40)">दाएँ ➡️</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const tharImg = new Image();
        tharImg.src = 'thar.png'; // आपकी इमेज यहाँ लोड होगी

        let carX = 120, score = 0, enemyY = -100, enemyX = 120;

        function draw() {
            ctx.clearRect(0, 0, 300, 400);
            
            // थार को ड्रा करें (इमेज)
            ctx.drawImage(tharImg, carX, 300, 60, 80);
            
            // दुश्मन कार (रेड रेक्टेंगल)
            ctx.fillStyle = "red";
            ctx.fillRect(enemyX, enemyY, 60, 80);
            
            enemyY += 5;
            if(enemyY > 400) { enemyY = -100; enemyX = Math.random() * 240; score += 10; document.getElementById("score").innerText = score; }
            
            requestAnimationFrame(draw);
        }

        function move(dir) {
            carX += dir;
            if(carX < 0) carX = 0;
            if(carX > 240) carX = 240;
        }

        tharImg.onload = draw;
    </script>
</body>
</html>
